global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - payment-service:8080
        labels:
          service: payment-service

  - job_name: payment-processor-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - payment-processor-service:8082
        labels:
          service: payment-processor-service
