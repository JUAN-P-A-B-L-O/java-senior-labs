x-payment-lab-logging: &payment-lab-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *payment-lab-logging
    image: postgres:16-alpine
    container_name: payment-lab-postgres
    environment:
      POSTGRES_DB: payment_lab
      POSTGRES_USER: payment_lab
      POSTGRES_PASSWORD: payment_lab
    ports:
      - "5433:5432"
    volumes:
      - payment_lab_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_lab -d payment_lab"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    <<: *payment-lab-logging
    image: rabbitmq:3.13-management-alpine
    container_name: payment-lab-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    <<: *payment-lab-logging
    image: apache/kafka:4.0.0
    container_name: payment-lab-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes:
      - payment_lab_kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10

  redis:
    <<: *payment-lab-logging
    image: redis:7.4-alpine
    container_name: payment-lab-redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  loki:
    <<: *payment-lab-logging
    image: grafana/loki:3.3.2
    container_name: payment-lab-loki
    command: -config.file=/etc/loki/loki-config.yml
    networks:
      - observability
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - payment_lab_loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    <<: *payment-lab-logging
    image: grafana/grafana:11.4.0
    container_name: payment-lab-grafana
    networks:
      - observability
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - payment_lab_grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_started
      tempo:
        condition: service_started

  prometheus:
    <<: *payment-lab-logging
    image: prom/prometheus:v2.55.1
    container_name: payment-lab-prometheus
    networks:
      - observability
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - payment_lab_prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  tempo:
    <<: *payment-lab-logging
    image: grafana/tempo:2.6.1
    container_name: payment-lab-tempo
    user: "0"
    networks:
      - observability
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - payment_lab_tempo_data:/tmp/tempo

  alloy:
    <<: *payment-lab-logging
    image: grafana/alloy:v1.5.1
    container_name: payment-lab-alloy
    networks:
      - observability
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./logs:/var/log/payment-lab:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      loki:
        condition: service_healthy

volumes:
  payment_lab_kafka_data:
  payment_lab_postgres_data:
  payment_lab_loki_data:
  payment_lab_grafana_data:
  payment_lab_prometheus_data:
  payment_lab_tempo_data:

networks:
  observability:
    name: payment-lab-observability
