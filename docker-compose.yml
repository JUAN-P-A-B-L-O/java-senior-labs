x-payment-lab-logging: &payment-lab-logging
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  auth-init:
    image: eclipse-temurin:21-jre
    user: "0"
    restart: "no"
    entrypoint: ["sh", "/init-auth.sh"]
    volumes:
      - ./docker/init-auth.sh:/init-auth.sh:ro
      - payment_lab_jwt_private:/keys/private
      - payment_lab_jwt_public:/keys/public

  database-init:
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: payment_lab
      PGPASSWORD: payment_lab
      PGDATABASE: payment_lab
    entrypoint: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/init-databases.sql"]
    volumes:
      - ./docker/init-databases.sql:/init-databases.sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  payment-service:
    <<: *payment-lab-logging
    build:
      context: ./services/payment-service
      dockerfile: docker/Dockerfile
    container_name: payment-lab-payment-service
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?Set ANTHROPIC_API_KEY in the local .env file}
      SPRING_AI_ANTHROPIC_CHAT_OPTIONS_MODEL: claude-haiku-4-5-20251001
      SPRING_AI_ANTHROPIC_CHAT_OPTIONS_MAX_TOKENS: "100"
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/payment_lab
      DB_USERNAME: payment_lab
      DB_PASSWORD: payment_lab
      REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
      JWT_PUBLIC_KEY: file:/keys/public/public.pem
      JWT_PRIVATE_KEY: file:/keys/private/private.pem
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
    entrypoint: ["sh", "-ec"]
    command:
      - |
        export AUTH_ADMIN_PASSWORD="$$(cat /keys/private/admin-password)"
        export AUTH_PROCESSOR_PASSWORD="$$(cat /keys/private/processor-password)"
        exec java -jar /app/payment-service.jar
    ports:
      - "127.0.0.1:${PAYMENT_PORT:-8080}:8080"
    networks: [default, observability]
    volumes:
      - payment_lab_jwt_public:/keys/public:ro
      - payment_lab_jwt_private:/keys/private:ro
      - payment_lab_payment_logs:/app/logs
    depends_on:
      auth-init:
        condition: service_completed_successfully
      database-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10

  payment-authorization-service:
    <<: *payment-lab-logging
    build:
      context: ./services/payment-authorization-service
      dockerfile: docker/Dockerfile
    container_name: payment-lab-authorization-service
    environment:
      SERVER_PORT: 8084
      JWT_PUBLIC_KEY: file:/keys/public/public.pem
      AUTHORIZATION_LONG_DELAY_PROBABILITY_PERCENT: ${AUTHORIZATION_LONG_DELAY_PROBABILITY_PERCENT:-0}
    ports:
      - "127.0.0.1:${AUTHORIZATION_PORT:-8085}:8084"
    volumes:
      - payment_lab_jwt_public:/keys/public:ro
      - payment_lab_authorization_logs:/app/logs
    depends_on:
      auth-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

  payment-processor-service:
    <<: *payment-lab-logging
    build:
      context: ./services/payment-processor-service
      dockerfile: docker/Dockerfile
    container_name: payment-lab-processor-service
    environment:
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/payment_processor_db
      DB_USERNAME: payment_lab
      DB_PASSWORD: payment_lab
      SPRING_RABBITMQ_HOST: rabbitmq
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AUTHORIZATION_URL: http://payment-authorization-service:8084/api/authorizations
      JWT_PUBLIC_KEY: file:/keys/public/public.pem
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
    ports:
      - "127.0.0.1:${PROCESSOR_PORT:-8083}:8082"
    networks: [default, observability]
    volumes:
      - payment_lab_jwt_public:/keys/public:ro
      - payment_lab_processor_logs:/app/logs
    depends_on:
      auth-init:
        condition: service_completed_successfully
      database-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
      payment-authorization-service:
        condition: service_healthy
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10

  postgres:
    <<: *payment-lab-logging
    image: postgres:16-alpine
    container_name: payment-lab-postgres
    environment:
      POSTGRES_DB: payment_lab
      POSTGRES_USER: payment_lab
      POSTGRES_PASSWORD: payment_lab
    ports:
      - "5433:5432"
    volumes:
      - payment_lab_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_lab -d payment_lab"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    <<: *payment-lab-logging
    image: rabbitmq:3.13-management-alpine
    container_name: payment-lab-rabbitmq
    hostname: payment-lab-rabbitmq
    volumes:
      - payment_lab_rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-storage-init:
    image: apache/kafka:4.0.0
    user: "0"
    restart: "no"
    entrypoint: ["chown", "-R", "1000:1000", "/tmp/kraft-combined-logs"]
    volumes:
      - payment_lab_kafka_data:/tmp/kraft-combined-logs

  kafka:
    <<: *payment-lab-logging
    image: apache/kafka:4.0.0
    container_name: payment-lab-kafka
    depends_on:
      kafka-storage-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes:
      - payment_lab_kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10

  redis:
    <<: *payment-lab-logging
    image: redis:7.4-alpine
    container_name: payment-lab-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - payment_lab_redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  loki:
    <<: *payment-lab-logging
    image: grafana/loki:3.3.2
    container_name: payment-lab-loki
    command: -config.file=/etc/loki/loki-config.yml
    networks:
      - observability
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - payment_lab_loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    <<: *payment-lab-logging
    image: grafana/grafana:11.4.0
    container_name: payment-lab-grafana
    networks:
      - observability
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - payment_lab_grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_started
      tempo:
        condition: service_started

  prometheus:
    <<: *payment-lab-logging
    image: prom/prometheus:v2.55.1
    container_name: payment-lab-prometheus
    networks:
      - observability
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - payment_lab_prometheus_data:/prometheus

  tempo:
    <<: *payment-lab-logging
    image: grafana/tempo:2.6.1
    container_name: payment-lab-tempo
    user: "0"
    networks:
      - observability
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - payment_lab_tempo_data:/tmp/tempo

  alloy:
    <<: *payment-lab-logging
    image: grafana/alloy:v1.5.1
    container_name: payment-lab-alloy
    networks:
      - observability
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - payment_lab_payment_logs:/var/log/payment-lab/payment-service:ro
      - payment_lab_processor_logs:/var/log/payment-lab/payment-processor-service:ro
      - payment_lab_authorization_logs:/var/log/payment-lab/payment-authorization-service:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      loki:
        condition: service_healthy

volumes:
  payment_lab_jwt_private:
  payment_lab_jwt_public:
  payment_lab_payment_logs:
  payment_lab_processor_logs:
  payment_lab_authorization_logs:
  payment_lab_rabbitmq_data:
  payment_lab_redis_data:
  payment_lab_kafka_data:
  payment_lab_postgres_data:
  payment_lab_loki_data:
  payment_lab_grafana_data:
  payment_lab_prometheus_data:
  payment_lab_tempo_data:

networks:
  default:
    driver: bridge
  observability:
    name: payment-lab-observability
