spring:
  datasource:
    url: jdbc:h2:mem:payment_processor_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        auto-startup: false
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: ${PAYMENT_PROCESS_RETRY_INTERVAL:30s}
          multiplier: 1
          max-interval: ${PAYMENT_PROCESS_RETRY_INTERVAL:30s}

payment-processor:
  authorization-url: http://localhost:8084/api/authorizations
  authorization-timeout: 2s
  authorization-max-attempts: 3
  authorization-backoff: 1000ms
  authorization-circuit-breaker-sliding-window-size: 3
  authorization-circuit-breaker-minimum-calls: 3
  authorization-circuit-breaker-failure-rate-threshold: 50
  authorization-rate-limit-for-period: 5
  authorization-rate-limit-refresh-period: 1s
  authorization-rate-limit-timeout: 0s
  authorization-bulkhead-max-concurrent-calls: 2
  authorization-bulkhead-max-wait-duration: 0s
  kafka:
    enabled: false
