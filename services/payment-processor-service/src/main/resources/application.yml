server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: payment-processor-service
  rabbitmq:
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s
          multiplier: 1
          max-interval: 2s

payment-processor:
  authorization-url: https://util.devi.tools/api/v2/authorize
