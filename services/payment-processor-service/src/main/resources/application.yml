server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: payment-processor-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/payment_processor_db}
    username: ${DB_USERNAME:payment_lab}
    password: ${DB_PASSWORD:payment_lab}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      observation-enabled: true
    listener:
      simple:
        observation-enabled: true
        default-requeue-rejected: false
        concurrency: 4
        max-concurrency: 4
        prefetch: 1
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: ${PAYMENT_PROCESS_RETRY_INTERVAL:30s}
          multiplier: 1
          max-interval: ${PAYMENT_PROCESS_RETRY_INTERVAL:30s}

logging:
  file:
    path: ${LOG_DIR:${LOG_ROOT:/home/juaneugenio/programmig/java-senior-labs/logs}/payment-processor-service}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      application: ${spring.application.name}

payment-processor:
  authorization-url: ${AUTHORIZATION_URL:http://localhost:8084/api/authorizations}
  authorization-timeout: ${AUTHORIZATION_TIMEOUT:2s}
  authorization-max-attempts: ${AUTHORIZATION_MAX_ATTEMPTS:3}
  authorization-backoff: ${AUTHORIZATION_BACKOFF:1000ms}
  authorization-circuit-breaker-sliding-window-size: ${AUTHORIZATION_CIRCUIT_BREAKER_SLIDING_WINDOW_SIZE:3}
  authorization-circuit-breaker-minimum-calls: ${AUTHORIZATION_CIRCUIT_BREAKER_MINIMUM_CALLS:3}
  authorization-circuit-breaker-failure-rate-threshold: ${AUTHORIZATION_CIRCUIT_BREAKER_FAILURE_RATE_THRESHOLD:50}
  # Per processor instance; each HTTP attempt, including retries, consumes a permit.
  authorization-rate-limit-for-period: ${AUTHORIZATION_RATE_LIMIT_FOR_PERIOD:5}
  authorization-rate-limit-refresh-period: ${AUTHORIZATION_RATE_LIMIT_REFRESH_PERIOD:1s}
  authorization-rate-limit-timeout: ${AUTHORIZATION_RATE_LIMIT_TIMEOUT:0s}
