server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: payment-processor-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/payment_processor_db}
    username: ${DB_USERNAME:payment_lab}
    password: ${DB_PASSWORD:payment_lab}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      observation-enabled: true
    listener:
      simple:
        observation-enabled: true
        default-requeue-rejected: false
        concurrency: 4
        max-concurrency: 4
        prefetch: 1
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s
          multiplier: 1
          max-interval: 2s

logging:
  file:
    path: ${LOG_DIR:${LOG_ROOT:/home/juaneugenio/programmig/java-senior-labs/logs}/payment-processor-service}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      application: ${spring.application.name}
