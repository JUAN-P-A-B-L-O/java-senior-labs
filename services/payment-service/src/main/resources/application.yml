spring:
  application:
    name: payment-lab
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s
          multiplier: 1
          max-interval: 2s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/payment_lab}
    username: ${DB_USERNAME:payment_lab}
    password: ${DB_PASSWORD:payment_lab}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

logging:
  file:
    name: ${LOG_FILE:logs/payment-service.log}
  pattern:
    level: "%5p traceId=%X{traceId} paymentId=%X{paymentId}"
